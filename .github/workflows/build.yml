name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'media/**'
      - 'privacy.html'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --org com.easyprompt --project-name easy_prompt .

      - name: Set app name and icon
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Easy Prompt"/' android/app/src/main/AndroidManifest.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ic_launcher-$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done

      - name: Add INTERNET permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Add AdMob app ID
        run: |
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7904413176110804~1103429064"/>\n    </application>#' android/app/src/main/AndroidManifest.xml

      - name: Set up permanent release signing
        env:
          KS_BASE64: ${{ secrets.KS_BASE64 }}
        run: |
          echo "$KS_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Patch Gradle (lint, minify, signing)
        run: |
          cat > android/app/proguard-rules.pro <<'PRO'
          -keep class androidx.work.** { *; }
          -keep class androidx.room.** { *; }
          -dontwarn **
          PRO
          python3 - <<'PY'
          p = "android/app/build.gradle.kts"
          s = open(p).read()
          s = s.replace("android {", "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }", 1)
          signing = (
              "    signingConfigs {\n"
              "        create(\"release\") {\n"
              "            storeFile = file(\"upload-keystore.jks\")\n"
              "            storePassword = System.getenv(\"KS_PASS\")\n"
              "            keyAlias = \"upload\"\n"
              "            keyPassword = System.getenv(\"KS_PASS\")\n"
              "        }\n"
              "    }\n\n"
              "    buildTypes {"
          )
          s = s.replace("    buildTypes {", signing, 1)
          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")\n'
              '            isMinifyEnabled = false\n'
              '            isShrinkResources = false\n'
              '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
              1)
          open(p, "w").write(s)
          PY
          grep -n "release\|lint\|isMinify" android/app/build.gradle.kts

      - run: flutter pub get

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: flutter build apk --release

      - name: Show APK signature
        continue-on-error: true
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $AS verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: easy-prompt-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.easyprompt.easy_prompt -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d | grep -iE "FATAL|AndroidRuntime|easyprompt" | head -50
