name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "media/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android scaffold
        run: flutter create --platforms=android --project-name easy_prompt --org com.example.easyprompt .

      - name: Add INTERNET permission
        run: |
          sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Add AdMob app ID
        run: |
          sed -i '0,/<activity/s//<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7904413176110804~1103429064"\/>\n        <activity/' android/app/src/main/AndroidManifest.xml
          grep APPLICATION_ID android/app/src/main/AndroidManifest.xml

      - name: Disable lint checks for release build
        run: |
          sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n/' android/app/build.gradle.kts
          grep -n -A4 "^android {" android/app/build.gradle.kts

      - run: flutter pub get

      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: easy-prompt-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.example.easyprompt.easy_prompt -c android.intent.category.LAUNCHER 1
            sleep 25
            echo ===== CRASH LOG =====
            adb logcat -d -b crash
            echo ===== FILTERED LOG =====
            adb logcat -d | grep -E "FATAL|AndroidRuntime|easy_prompt|Exception" | head -80
