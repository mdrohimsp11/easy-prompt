name: Update media index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "media/**"

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.json
        run: |
          cd media
          ls -1 | grep -v -E '^(index\.json|readme\.txt)$' | python3 -c "import sys,json; print(json.dumps(sorted(l.strip() for l in sys.stdin if l.strip()), indent=1))" > index.json
          cat index.json

      - name: Commit index
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add media/index.json
          git diff --cached --quiet || git commit -m "Update media index"
          git push
